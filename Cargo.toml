[workspace]
members = [
    "packages/rpi-run-stats",
    "packages/rpi-mcp-adapter",
    "packages/rpi-mcp-core",
    "packages/rpi-mcp-server",
    "packages/rpi-subagents",
    "packages/rpi-codemode",
    "packages/rpi-btw",
    "packages/rpi-lens",
    "packages/rpi-orchestrator",
    "packages/rpi-todo",
    "packages/rpi-background-tasks",
    "packages/rpi-goal",
    "packages/rpi-optchat",
    "packages/rpi-plan-mode",
    "packages/rpi-codegraph",
    "packages/rpi-ask-user",
    "packages/rpi-permissions",
    "packages/rpi-websearch",
    "packages/rpi-webfetch",
    "packages/rpi-edit-diagnostics",
    "packages/rpi-im-message",
    "packages/rpi-office",
    "packages/rpi-server",
    "packages/rpi-acp",
    "packages/rpi-ui-adapter",
    "packages/rpi-permission-gate",
    "packages/rpi-langfuse",
    "packages/rpi-voice",
    "packages/rpi-tts",
    "packages/rpi-providers",
    "packages/rpi-web",
    "packages/rpi-extcore",
    "packages/rpi-host",
    "packages/rpi-node-core",
    "packages/rpi-node",
    "packages/rpi-httpcore",
    "packages/rpi-http",
    "tools/rpi-package-install",
]
exclude = ["tools/rpi-package-smoke"]
resolver = "2"

[workspace.package]
version = "0.1.17"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["BigFish <bigfish1913@gmail.com>"]
repository = "https://github.com/pi-rust/rpi-extension"

[workspace.dependencies]
# Pin the companion SDK revision until these adapters reach crates.io.
rpi-plugin-sdk = { version = "=0.30.0", git = "https://github.com/bigfish1913/pi-rust", rev = "8d3f184de93ac696ba6cbe8d0798220df69bcf9b" }
rpi-ai = { version = "=0.30.0", git = "https://github.com/bigfish1913/pi-rust", rev = "8d3f184de93ac696ba6cbe8d0798220df69bcf9b" }
rpi-extensions = { version = "=0.30.0", git = "https://github.com/bigfish1913/pi-rust", rev = "8d3f184de93ac696ba6cbe8d0798220df69bcf9b" }
feishu-sdk = { version = "0.1.2", default-features = false, features = ["websocket"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
wait-timeout = "0.2"
async-trait = "0.1"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "symbols"
