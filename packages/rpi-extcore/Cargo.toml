[package]
name = "rpi-extcore"
version = "0.2.18"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared native RPC, session and workspace services for rpi extensions"
readme = "README.md"
keywords = ["rpi", "agent", "rpc", "session", "workspace"]
categories = ["api-bindings", "command-line-utilities", "development-tools"]

[features]
test-support = []

[dependencies]
serde = { workspace = true }
serde_json.workspace = true
rpi-mcp-core = { path = "../rpi-mcp-core", version = "0.1.2" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "net", "fs", "signal"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
futures-util = "0.3"
base64 = "0.22"
fs2 = "0.4"

[target.'cfg(unix)'.dependencies]
# Safe effective-UID/peer checks for explicit shared Host IPC. No plugin ABI.
nix = { version = "0.29", features = ["user"] }

[target.'cfg(unix)'.dev-dependencies]
# Required-artifact daemon tests stop only the child process they created.
nix = { version = "0.29", features = ["signal"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
