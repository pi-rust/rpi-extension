[package]
name = "rpi-orchestrator"
version = "0.1.18"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bounded DAG subagent orchestration extension for the rpi Rust agent"
readme = "README.md"
keywords = ["rpi", "subagent", "orchestration", "plugin"]
categories = ["development-tools"]

[package.metadata.rpi.prebuilt]
supported-targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rpi-plugin-sdk = { workspace = true, features = ["process"] }
serde_json = { workspace = true }
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
rpi-abi-test-support = { path = "../../tools/rpi-abi-test-support" }

[lints]
workspace = true
