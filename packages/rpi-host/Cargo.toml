[package]
name = "rpi-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Explicit shared Host control tool for rpi"
# Experimental source-only client; merging this PR must not publish a crate.
publish = false
readme = "README.md"
keywords = ["rpi", "host", "agent", "plugin"]
categories = ["development-tools"]

[lib]
crate-type = ["cdylib", "rlib"]

# Source-only: also exclude the DLL from automatic prebuilt bundle discovery.
[package.metadata.rpi.prebuilt]
supported-targets = []

[dependencies]
rpi-plugin-sdk.workspace = true
rpi-extcore = { path = "../rpi-extcore", version = "0.2.18" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "time", "macros"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["user"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
